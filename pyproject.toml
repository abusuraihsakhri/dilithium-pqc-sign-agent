[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dilithium-pqc-sign-engine"
version = "2.0.0"
description = "ML-DSA / CRYSTALS-Dilithium Post-Quantum Digital Signature Verification Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dilithium-pqc-sign-engine = "dilithium_sign.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dilithium-pqc-sign-engine"
Repository = "https://github.com/abusuraihsakhri/dilithium-pqc-sign-engine.git"
