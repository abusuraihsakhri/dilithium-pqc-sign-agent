services:
  dilithium-pqc-sign-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set a unique audit secret (at least 32 characters)}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:?Set a unique API token (at least 32 characters)}"
    restart: unless-stopped
